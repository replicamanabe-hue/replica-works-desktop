# タグ v* を push すると Mac（Universal）と Windows（x64）の配布物を作って GitHub Release に載せる。
# Mac の署名・公証は secrets が揃っているときだけ行う（無ければ未署名で出る。初回起動は右クリック→開く）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # macOS 署名・公証（任意）。secrets が入っているものだけ環境変数にする。
      # 空文字で渡すと Tauri が証明書の取り込みを試みて失敗するので、ここで中身のあるものだけを選ぶ
      - name: Apple signing env (only when secrets exist)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__EOF_$v"; echo "${!v}"; echo "__EOF_$v"; } >> "$GITHUB_ENV"
              echo "$v: set"
            else
              echo "$v: (none)"
            fi
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Replica Works ${{ github.ref_name }}"
          releaseBody: |
            Mac: `.dmg` を開いて Replica Works をアプリケーションにドラッグ。
            Windows: `-setup.exe` を実行。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
