# タグ v* を push すると Windows（x64）をビルドし、Microsoft Store 提出用の .msix だけを GitHub Release に載せる。
# 配布はストアだけ。.dmg / .exe / .msi などのインストーラーは作らない・載せない。
# Release は最初に下書きで作り、.msix が揃ったときだけ公開する。
# .msix は未署名（Store が署名する）。Variables に MSIX_IDENTITY_NAME / MSIX_PUBLISHER が要る（無いと止まる）。
# Mac App Store 用の .pkg は手元の Mac で scripts/appstore-mac.sh（証明書と Provisioning Profile が要るため）。
# 外部の Action はコミット SHA で固定する（タグは書き換えられるため）。上げるときは SHA と後ろの版コメントを一緒に直す。
name: release

on:
  push:
    tags: ["v*"]
  # 手動実行はタグ（v*）を選んだときだけ動く。ブランチを選んだ場合は何もしない
  workflow_dispatch:

# 既定は読み取りだけ。Release を触るジョブにだけ contents: write を付ける
permissions:
  contents: read

jobs:
  # 版の確認と、下書き Release の用意
  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # タグと package.json / tauri.conf.json / Cargo.toml の version が食い違っていたら止める
      - name: Check tag matches versions
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg=$(jq -r .version package.json)
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if ! [[ "$pkg" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json の version が X.Y.Z の形ではありません: $pkg"
            exit 1
          fi
          for v in "$conf" "$cargo" "${TAG#v}"; do
            if [ "$v" != "$pkg" ]; then
              echo "::error::タグ $TAG と version が一致しません（package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo）"
              exit 1
            fi
          done
          if [ "$TAG" != "v$pkg" ]; then
            echo "::error::タグは v$pkg の形にしてください: $TAG"
            exit 1
          fi

      # 同じタグの Release（下書きを含む）があれば使い、無ければ下書きで作る。再実行しても増えない
      - name: Create draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: |
            Microsoft Store 提出用の .msix です。アプリは Mac App Store / Microsoft Store から入れてください。
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\")][0].id // empty")
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="Replica Works $TAG" -f body="$NOTES" -F draft=true --jq .id)
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: windows-latest
    # .msix を Release に添付するので書き込みが要る
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable（2026-10-16 時点）
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci

      # exe だけ作る（.exe / .msi のインストーラーは作らない。直接配布はしない）
      - name: Build
        run: npx tauri build --no-bundle

      # Microsoft Store 提出用の MSIX を作って Release に添付する
      - name: MSIX for Microsoft Store
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ./scripts/make-msix.ps1 -Tag $env:RELEASE_TAG

  # ビルドが成功したら公開する。落ちたら下書きのまま残るので、
  # `gh run rerun <run-id> --failed` で再実行すれば続きから公開まで進む
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --jq .html_url
