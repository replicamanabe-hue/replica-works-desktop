<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replica Works</title>
<!-- CSP（tauri.conf.json）で外部ファイルだけを許しているので、スタイルとスクリプトは同じフォルダのファイルに置く -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <p class="eyebrow">REPLICA WORKS</p>
  <p id="connecting" role="status">接続しています…</p>
  <div id="notice" hidden>
    <p role="alert">Replica Works に接続できませんでした。<br>インターネット接続を確認して、もう一度お試しください。</p>
    <button type="button" id="retry">再試行</button>
  </div>
</main>
<script src="main.js"></script>
</body>
</html>
